 m.innerHTML=`<div class="card" style="width:min(92vw,340px);margin:0;position:relative"><button id="nx" aria-label="Закрыть" style="position:absolute;top:6px;right:8px;width:40px;height:40px;border:0;background:transparent;color:var(--mut);font-size:22px">✕</button><b style="font-size:18px">${NICK?'Аккаунт':'Регистрация'}</b><div style="color:var(--mut);font-size:14px;line-height:1.5;margin:8px 0 12px">${!FBOK()?'Сервер ещё не настроен: прогресс хранится только на этом устройстве.':NICK?'Ты вошёл как <b>'+NICK+'</b>. Прогресс сохраняется автоматически.':'Создай аккаунт (твой текущий прогресс сохранится в него) или войди в существующий с любого телефона.'}</div><input id="ni" maxlength="20" placeholder="Придумай ник" value="${NICK}" style="${inp}"><input id="np" type="password" maxlength="40" placeholder="Придумай пароль (от 4 символов)" style="${inp}"><div id="nmsg" style="color:#f87171;font-size:13px;min-height:20px;margin:2px 0 8px"></div><div class="row"><button class="chip on" id="nin">Войти</button><button class="chip on" id="nup">Создать</button>${NICK?'<button class="chip" id="nout">Выйти</button>':''}</div></div>`;
 document.body.appendChild(m);
 const msg=t=>{$('#nmsg').textContent=t};
 $('#nx').onclick=()=>m.remove();
 if($('#nout'))$('#nout').onclick=()=>{localStorage.removeItem('nm_nick');localStorage.removeItem('nm_h');NICK='';HASH='';upd();m.remove()};
 async function auth(up){
  const n=$('#ni').value.trim().toLowerCase().replace(/\s+/g,''),p=$('#np').value;
  if(!/^[a-zа-яё0-9_-]{2,20}$/.test(n))return msg('Ник: 2–20 символов, буквы, цифры, _ или -');
  if(p.length<4)return msg('Пароль: минимум 4 символа');
  if(!FBOK())return msg('Сервер не настроен');
  msg('Загрузка…');
  try{
   const h=await hsh(n,p),a=await getAcc(n);
   if(up){if(a)return msg('Этот ник уже занят');
    await putAcc(n,h,JSON.stringify(S));NICK=n;HASH=h;localStorage.setItem('nm_nick',n);localStorage.setItem('nm_h',h);upd();m.remove();return}
   if(!a)return msg('Аккаунт не найден');
   if(a.h!==h)return msg('Неверный пароль');
   NICK=n;HASH=h;localStorage.setItem('nm_nick',n);localStorage.setItem('nm_h',h);loadRemote(a.d);
  }catch(e){msg('Нет связи с сервером')}
 }
 $('#nin').onclick=()=>auth(false);$('#nup').onclick=()=>auth(true);
}
upd();
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadTop(){
 const say=h=>{const b=$('#lb');if(b&&tab=='l')b.innerHTML=h};
 const card=t=>`<div class="card" style="text-align:center;color:var(--mut)">${t}</div>`;
 if(!FBOK())return say(card('Сервер не настроен'));
 try{
  if(NICK&&HASH)await putAcc(NICK,HASH,JSON.stringify(S)).catch(()=>{});
  const rows=[];let tok='';
  do{
   const u=`https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents/accounts?pageSize=300&mask.fieldPaths=nick&mask.fieldPaths=mo&mask.fieldPaths=usd&mask.fieldPaths=ru&mask.fieldPaths=kz&key=${FB.apiKey}`+(tok?'&pageToken='+encodeURIComponent(tok):'');
   const r=await fetch(u);if(!r.ok)throw new Error('net');const j=await r.json();
   (j.documents||[]).forEach(d=>{const f=d.fields||{},g=k=>+((f[k]||{}).integerValue||0);rows.push({nick:(f.nick||{}).stringValue||'?',mo:g('mo'),usd:g('usd'),ru:g('ru'),kz:g('kz')})});
   tok=j.nextPageToken||'';
  }while(tok&&rows.length<2000);
  if(!rows.length)return say(card('Пока нет игроков'));
  const row=(i,r,r1,r2)=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--bd);${r.nick==NICK?'color:#fde047;font-weight:700':''}"><span>${i+1}. ${esc(r.nick)}</span><span style="text-align:right">${r1}<br><small style="color:var(--mut)">${r2}</small></span></div>`;
  const a=[...rows].sort((x,y)=>y.mo-x.mo).slice(0,50).map((r,i)=>row(i,r,fmt(r.mo)+' ₽',fmt(r.usd)+' $')).join('');
  const b=[...rows].sort((x,y)=>(y.ru+y.kz)-(x.ru+x.kz)).slice(0,50).map((r,i)=>row(i,r,'Всего '+fmt(r.ru+r.kz),'Россия '+fmt(r.ru)+' · Казахстан '+fmt(r.kz))).join('');
  say(`<div class="card"><b style="font-size:18px">💰 Деньги игроков</b>${a}</div><div class="card"><b style="font-size:18px">🌍 Сколько номеров выпало</b>${b}</div>`);
 }catch(e){say(card('Не удалось загрузить рейтинг'))}
}
(async()=>{if(!FBOK()||!NICK||!HASH)return;try{const a=await getAcc(NICK);if(!a||a.h!==HASH)return;const r=JSON.parse(a.d);if((r.n||0)>S.n)loadRemote(a.d);else push(0)}catch(e){}})();
render();
if(FBOK()&&!NICK&&!localStorage.getItem('nm_seen')){localStorage.setItem('nm_seen','1');accUI()}
</script></body></html>
